<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battleship</title>
    <link rel="stylesheet" href="./UI/style.css">
</head>
<body>
    <h1>Battleship</h1>
    <h2 id="turncounter"></h2>
    <div class="playerName">
        <div>Player's Board</div>
        <div>Computer's Board</div>
        <div>Message Board</div>
    </div>
    <br>
    <div class="table">
        <div class="gameboard" id="playerboard"></div>
        <div class="gameboard" id="computerboard"></div>
        <div id="shots"></div>
    </div>
    <br>
    <div id="playerShips">
        <h3>Place your coordinates for your ships. The point you choose will be the starting point for each ship. 
        Example X,Y<br>X is vertical (up and down). Y is horizontal (left to right)
        </h3>

        <form>
            <label for="carrier">Carrier</label>
            <input type="text" value="1,1" id="carrier">
            <select id="carrierOrientation">
                <option>vertical</option>
                <option>horizontal</option>
            </select>
            <br><br>
            <label for="battleship">Battleships</label>
            <input type="text" value="4,4" id="battleship">
            <select id="battleshipOrientation">
                <option>vertical</option>
                <option>horizontal</option>
            </select>
            <br><br>
            <label for="cruiser">Cruiser</label>
            <input type="text" value="7,1" id="cruiser">
            <select id="cruiserOrientation">
                <option>vertical</option>
                <option>horizontal</option>
            </select>
            <br><br>
            <label for="submarine">Submarine</label>
            <input type="text" value="1,6" id="submarine">
            <select id="submarineOrientation">
                <option>vertical</option>
                <option>horizontal</option>
            </select>
            <br><br>
            <label for="destroyer">Destroyer</label>
            <input type="text" value="8,8" id="destroyer">
            <select id="destroyerOrientation">
                <option>vertical</option>
                <option>horizontal</option>
            </select>
        </form>
        <br>
        <button id="start">Start Game</button>
    </div>
    <script type="module" src="gameController.js"></script>
</body>
</html>
